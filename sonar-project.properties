# Supply the existing project key, server URL and token when running the scanner.
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**,node_modules/**,.next/**,public/workspace/**,generated/**,dist/**,dist-vercel/**,artifacts/**,coverage/**,.scannerwork/**,cloud.js,navigation.js,next-env.d.ts,**/*.tsbuildinfo,**/.env,**/.env.*,**/*.log,**/*.zip,**/*.bak
sonar.javascript.file.suffixes=.js,.jsx,.cjs,.mjs,.gs
sonar.typescript.tsconfigPaths=tsconfig.json
