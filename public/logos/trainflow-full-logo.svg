<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <!-- Linear Gradient for Streamlines -->
    <linearGradient id="tfInfinityGrad" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#0047BA" />
      <stop offset="40%" stop-color="#0066E0" />
      <stop offset="75%" stop-color="#00A3FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <!-- Top T Wings Gradient -->
    <linearGradient id="tfWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003D9E" />
      <stop offset="100%" stop-color="#0080FF" />
    </linearGradient>

    <!-- Glow Filter for subtle tech vibrancy -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(0, 10)">
    <!-- Top Left T-Wings -->
    <!-- Wing 1 (Top Bar) -->
    <path d="M 102 82 C 102 82 135 80 152 80 C 160 80 162 87 155 90 C 138 97 116 100 102 101 Z" 
          fill="url(#tfWingGrad)" />
    <!-- Wing 2 (Middle Wing) -->
    <path d="M 104 104 C 114 104 144 100 158 97 C 166 95 168 103 161 106 C 145 113 126 116 112 116 Z" 
          fill="url(#tfWingGrad)" />

    <!-- 3 Parallel Streamlines forming the Infinity Flow (Outer, Middle, Inner) -->
    
    <!-- Outer Streamline Path -->
    <path d="M 166 84 
             C 140 84, 120 105, 120 135 
             C 120 168, 142 196, 172 196 
             C 198 196, 218 180, 235 158 
             C 255 132, 275 110, 305 110 
             C 338 110, 362 134, 362 165 
             C 362 198, 335 222, 302 222 
             C 272 222, 252 205, 235 184 
             C 216 160, 195 140, 168 140
             C 152 140, 140 152, 140 168
             C 140 182, 152 192, 168 192" 
          fill="none" 
          stroke="url(#tfInfinityGrad)" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Middle Streamline Path -->
    <path d="M 164 102 
             C 148 102, 136 116, 136 135 
             C 136 158, 152 178, 174 178 
             C 194 178, 210 166, 226 148 
             C 248 122, 270 98, 305 98 
             C 345 98, 376 126, 376 165 
             C 376 206, 342 236, 302 236 
             C 265 236, 242 216, 224 194 
             C 208 172, 190 154, 168 154" 
          fill="none" 
          stroke="url(#tfInfinityGrad)" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Inner Streamline / Accent Path -->
    <path d="M 162 120 
             C 155 120, 150 126, 150 135 
             C 150 148, 160 160, 174 160 
             C 188 160, 202 152, 216 138 
             C 240 112, 266 84, 305 84 
             C 353 84, 390 118, 390 165 
             C 390 214, 350 250, 302 250 
             C 258 250, 232 226, 212 202 
             C 198 184, 184 170, 168 170" 
          fill="none" 
          stroke="url(#tfInfinityGrad)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- TrainFlow Brand Wordmark -->
  <text x="200" y="295" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', system-ui, sans-serif" 
        font-size="44" 
        font-weight="800" 
        letter-spacing="-1.2px" 
        fill="#091E42">TrainFlow</text>
</svg>
